server {
    listen 80;
    root /usr/share/nginx/html;

    # The proxy in front already logs every request.
    access_log off;

    # This nginx listens on plain :80 behind the TLS proxy, so an absolute redirect would name
    # http:// and cost a second hop through the proxy's http → https redirect. Relative Location
    # headers keep the browser on https.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # One URL per page: /faq/ → /faq (301). Canonical/hreflang point at the no-slash form.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Astro puts a content hash in these names, so a file here never changes.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
