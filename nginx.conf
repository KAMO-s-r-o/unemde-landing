server {
    listen 80;
    root /usr/share/nginx/html;

    # The proxy in front already logs every request.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # trailingSlash: "never" — /faq is served from faq/index.html, without a redirect to /faq/.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Astro puts a content hash in these names, so a file here never changes.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
